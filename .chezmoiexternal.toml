[".oh-my-zsh"]
    type = "archive"
    url = "https://github.com/ohmyzsh/ohmyzsh/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
["wiki"]
    type = "git-repo"
    url = "git@github.com:koltempleister/wiki.git"
["displaylink-debian"]
    type = "git-repo"
    url = "git@github.com:AdnanHodzic/displaylink-debian.git"
[".tmux/plugins/tpm"]
    type="git-repo"
    url = "https://github.com/tmux-plugins/tpm.git"
[".tmux/plugins/catpuccin/tmux"]
    type = "git-repo"
    url = "https://github.com/catppuccin/tmux.git"
[".tmux/plugins/tmux-battery"]
    type = "git-repo"
    url = "git@github.com:tmux-plugins/tmux-battery.git"
[".tmux/plugins/tmux-cpu"]
    type = "git-repo"
    url = "git@github.com:tmux-plugins/tmux-cpu.git"
