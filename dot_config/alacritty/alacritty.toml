[general]
import = [
    "~/.config/alacritty/themes/themes/everforest_dark_medium.toml"
]

[window]
opacity = 0.8
padding.x=20
padding.y=20

[font]
#0size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"
