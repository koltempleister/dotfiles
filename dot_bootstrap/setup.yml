---
- name: Machine setup
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    # Defines the default system path where Linuxbrew is installed
    brew_dir: "/home/linuxbrew/.linuxbrew"

  tasks:
    - name: print all variables
      debug:
        msg: "User is {{ansible_env.USER  }}, sudo user is {{ ansible_env.SUDO_USER }}, home is {{lookup('env', 'HOME')}}"
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: jevdheyd 
    - name: install packages with error handling
      block:  
        - name: Install apt packages
          ansible.builtin.apt:
            name:
              - build-essential
              - git
              - curl 
              - tar
              - alacritty
              - make
              - patch
              - inkscape
            state: present
            update_cache: yes
      rescue:
        - name: Handle missing packages
          debug:
            msg: "Some packages where not found or installed."

    - name: Check if Linuxbrew is already installed
      ansible.builtin.stat:
        path: "{{ brew_dir }}/bin/brew"
      register: brew_stat

    - name: Create Homebrew directory
      ansible.builtin.file:
        path: "/home/linuxbrew/.linuxbrew"
        state: directory
        owner: "{{ remote_regular_user}}"
        group: "{{ remote_regular_user }}"
        mode: '0755'
      when: not brew_stat.stat.exists
      become: true

    - name: Securely download and run the official Homebrew installation script
      ansible.builtin.shell: |
        NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" 
      environment:
        NONINTERACTIVE: "1"
      when: not brew_stat.stat.exists
      become: true
      become_user: "{{ remote_regular_user  }}"

    - name: Ensure Linuxbrew environment variables are added to shell profile
      ansible.builtin.blockinfile:
        path: "~/.bashrc"
        block: |
          eval "$({{ brew_dir }}/bin/brew shellenv)"
        marker: "# {mark} ANSIBLE MANAGED BLOCK: Linuxbrew shell env"
        create: true
        mode: '0644'

    #- name: Verify that brew path works in this run
    #  ansible.builtin.command: "{{ brew_dir }}/bin/brew doctor"
    #  changed_when: false
    #  become: true
    #  become_user: "{{ remote_regular_user }}"

    - name: Install Brew packages
      block:  
        - name: install packages
          community.general.homebrew:
            name:
              - lazygit
              - nvim
              - sesh
              - zoxide
              - gonzo
              - lazydocker
              - ranger
              - nethogs
              - zsh
              - fzf
              - tmux
              - btop
              - vim
              - ripgrep
            update_homebrew: true
      become: true
      become_user: "{{ remote_regular_user }}"

    - name: Change shell to zsh
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        shell: /usr/bin/zsh
    
    - name: Install prerequisites
      ansible.builtin.apt:
        name: ["apt-transport-https", "ca-certificates", "curl", "gnupg"]
        state: present
        update_cache: yes

    - name: Create directory for Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name: ["docker-ce", "docker-ce-cli", "containerd.io", "docker-compose-plugin"]
        state: present
        update_cache: yes   

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        groups: docker
        append: true

