---
- name: Machine setup
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_env.SUDO_USER or ansible_user_id }}"

    - name: Install packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - lazygit
          - alacritty
          - neovim
          - btop
          - vim
          - ripgrep
          - zsh
          - fzf
          - tmux
          - make
          - patch
          - ranger
          - nethogs
          - inkscape
        state: present


    - name: Change shell to zsh
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        shell: /usr/bin/zsh

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Add Docker group
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        groups: docker
        append: true

    - name: add ddev gpg key 
      ansible.builtin.get_url:
        url: https://pkg.ddev.com/apt/gpg.key
        dest: /etc/apt/keyrings/ddev.gpg

    - name: add ddev repo 
      ansible.builtin.apt_repository:
        repo: deb [signed-by=/etc/apt/keyrings/ddev.gpg] https://pkg.ddev.com/apt/ * * 
        state: present
    
    - name: install ddev
      ansible.builtin.apt:
        name: 
          - ddev
        state: present

    - name: add brave-browser gpg key 
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg 
        dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg

    - name: add brave-browser repo 
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
        dest: /etc/apt/sources.list.d/brave-browser-release.sources
    
    - name: install brave-browser
      ansible.builtin.apt:
        name: 
          - brave-browser
        state: present

    - name: Check if Homebrew is installed
      ansible.builtin.stat:
        path: /opt/homebrew/bin/brew
      register: homebrew_check

    - name: Create Homebrew directory
      ansible.builtin.file:
        path: /home/linuxbrew/.linuxbrew
        state: directory
        owner: "{{ ansible_env.USER }}"
        group: "{{ ansible_env.USER }}"
        mode: '0755'
    
    - name: install homebrew
      ansible.builtin.shell:
        cmd: curl -fsSL https://github.com/Homebrew/brew/tarball/master | tar xz --strip 1 -C /home/linuxbrew/.linuxbrew
      when: not brew_stat.stat.exists
      environment:
        PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_env.PATH }}"

    #install sesh tmux sessions manager with homebrew
        #https://github.com/joshmedeski/sesh
    - name: Install Docker
      community.general.homebrew:
        path: ~/linuxbrew/bin
        name:
          - sesh
          - zoxide
          - gonzo
        state: present

    - name: Ensure fonts directory
      ansible.builtin.file:
        path: "~{{ remote_regular_user }}/.fonts"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"

    #install sesh tmux session manager with brew https://github.com/joshmedeski/sesh 
    #install zoxide with brew https://github.com/ajeetdsouza/zoxide

    - name: Check if Jetbrains Mono exists
      ansible.builtin.shell: "ls ~{{ remote_regular_user }}/.fonts/JetBrainsMonoNerd*FontMono*"
      register: jetbrains_mono_exists
      ignore_errors: true
      changed_when: false

    - name: Download Jetbrains mono nerdfont
      when: jetbrains_mono_exists is failed
      ansible.builtin.unarchive:
        src: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/JetBrainsMono.zip
        dest: "~{{ remote_regular_user }}/.fonts/"
        remote_src: true
        mode: "0755"
        owner: "{{ remote_regular_user }}"

