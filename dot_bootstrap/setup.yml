---
- name: Machine setup
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_env.SUDO_USER or ansible_user_id }}"
    - name: install packages with error handling
      block:  
        - name: Install packages
          ansible.builtin.apt:
            name:
              - curl
              - git
              - lazygit
              - alacritty
              - neovim
              - btop
              - vim
              - ripgrep
              - zsh
              - fzf
              - tmux
              - make
              - patch
              - ranger
              - nethogs
              - inkscape
            state: present
            update_cache: yes
      rescue:
        - name: Handle missing packages
          debug:
            msg: "Some packages where not found or installed."

    - name: Change shell to zsh
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        shell: /usr/bin/zsh
    
    - name: Install prerequisites
      ansible.builtin.apt:
        name: ["apt-transport-https", "ca-certificates", "curl", "gnupg"]
        state: present
        update_cache: yes

    - name: Create directory for Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name: ["docker-ce", "docker-ce-cli", "containerd.io", "docker-compose-plugin"]
        state: present
        update_cache: yes   

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        groups: docker
        append: true

    - name: Download DDEV GPG key
      get_url:
        url: https://pkg.ddev.com/apt/gpg.key
        dest: /tmp/ddev.gpg
        mode: '0644'

    - name: Add DDEV GPG key to keyring
      shell: |
        gpg --dearmor /tmp/ddev.gpg | tee /etc/apt/keyrings/ddev.gpg > /dev/null
        chmod a+r /etc/apt/keyrings/ddev.gpg
      args:
        creates: /etc/apt/keyrings/ddev.gpg

    - name: Add DDEV repository to sources list
      lineinfile:
        path: /etc/apt/sources.list.d/ddev.list
        line: 'deb [signed-by=/etc/apt/keyrings/ddev.gpg] https://pkg.ddev.com/apt/ * *'
        create: yes
        mode: '0644'

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install DDEV
      apt:
        name: ddev
        state: present

    - name: Install mkcert for SSL certificates (one-time)
      command: mkcert -install
      become: yes
      changed_when: false

    - name: add brave-browser gpg key 
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg 
        dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg

    - name: add brave-browser repo 
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
        dest: /etc/apt/sources.list.d/brave-browser-release.sources
    
    - name: install brave-browser
      ansible.builtin.apt:
        name: 
          - brave-browser
        state: present

    - name: Ensure fonts directory
      ansible.builtin.file:
        path: "~{{ remote_regular_user }}/.fonts"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"

    - name: Check if Jetbrains Mono exists
      ansible.builtin.shell: "ls ~{{ remote_regular_user }}/.fonts/JetBrainsMonoNerd*FontMono*"
      register: jetbrains_mono_exists
      ignore_errors: true
      changed_when: false

    - name: Download Jetbrains mono nerdfont
      when: jetbrains_mono_exists is failed
      ansible.builtin.unarchive:
        src: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/JetBrainsMono.zip
        dest: "~{{ remote_regular_user }}/.fonts/"
        remote_src: true
        mode: "0755"
        owner: "{{ remote_regular_user }}"

