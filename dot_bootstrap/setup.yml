---
- name: Machine setup
  hosts: localhost
  become: true
  connection: local
  gather_facts: true
  vars:
    flyctl_version: "0.1.130"
    pulumi_version: "v3.94.2"

  vars:
    # Defines the default system path where Linuxbrew is installed
    brew_dir: "/home/linuxbrew/.linuxbrew"

  tasks:
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_env.SUDO_USER or ansible_user_id }}"

    - name: Install packages
      ansible.builtin.dnf:
        name:
          - "@Development-tools"
          - "@C Development Tools and Libraries"
          - @c-development
          - git
          - curl
          - tar
          - gcc
          - alacritty
          - make
          - patch

        state: present

    - name: Check if Linuxbrew is already installed
      ansible.builtin.stat:
        path: "{{ brew_dir }}/bin/brew"
      register: brew_stat

    - name: Create Homebrew directory
      ansible.builtin.file:
        path: "/home/linuxbrew/.linuxbrew"
        state: directory
        owner: "{{ remote_regular_user}}"
        group: "{{ remote_regular_user }}"
        mode: '0755'
      when: not brew_stat.stat.exists
      become: true

    - name: Securely download and run the official Homebrew installation script
      ansible.builtin.shell: |
        NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      environment:
        NONINTERACTIVE: "1"
      when: not brew_stat.stat.exists
      become: true
      become_user: "{{ remote_regular_user  }}"

    - name: Ensure Linuxbrew environment variables are added to shell profile
      ansible.builtin.blockinfile:
        path: "~/.bashrc"
        block: |
          eval "$({{ brew_dir }}/bin/brew shellenv)"
        marker: "# {mark} ANSIBLE MANAGED BLOCK: Linuxbrew shell env"
        create: true
        mode: '0644'

    - name: Install Brew packages
      block:
        - name: install packages
          community.general.homebrew:
            name:
              - lazygit
              - nvim
              - sesh
              - zoxide
              - gonzo
              - lazydocker
              - ranger
              - nethogs
              - zsh
              - fzf
              - tmux
              - btop
              - vim
              - ripgrep
              - bitwarden-cli
            update_homebrew: true
      become: true
      become_user: "{{ remote_regular_user }}"

    - name: Change shell to zsh
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        shell: /usr/bin/zsh

    - name: Install DNF plugins core
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present

#    - name: Add Brave Browser Repo
#      ansible.builtin.yum_repository:
#        name: brave-browser
#        description: Brave Browser
#        baseurl: https://brave-browser-rpm-release.s3.brave.com/x86_64/
#        gpgkey: https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
#        gpgcheck: true
#        enabled: true
#
#    - name: Import Brave Browser GPG Key
#      ansible.builtin.rpm_key:
#        key: https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
#        state: present
#
#    - name: Install Brave Browser
#      ansible.builtin.dnf:
#        name: brave-browser
#        state: present

    - name: Add Docker repo
      ansible.builtin.yum_repository:
        name: docker
        description: Docker repo
        baseurl: "https://download.docker.com/linux/fedora/{{ ansible_distribution_major_version }}/{{ ansible_architecture }}/stable"
        gpgkey: "https://download.docker.com/linux/fedora/gpg"
        gpgcheck: true
        enabled: true

    - name: Install Docker
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Add Docker group
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        groups: docker
        append: true

    - name: Install Flatpak packages
      community.general.flatpak:
        name:
          - com.obsproject.Studio
          - org.videolan.VLC
          - org.tenacityaudio.Tenacity
          - md.obsidian.Obsidian
          - org.gimp.GIMP
          - rest.insomnia.Insomnia
          - com.github.johnfactotum.Foliate
          - org.gnome.meld
          - org.sqlitebrowser.sqlitebrowser
        state: present

    - name: Ensure fonts directory
      ansible.builtin.file:
        path: "~{{ remote_regular_user }}/.fonts"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"

    - name: Check if Jetbrains Mono exists
      ansible.builtin.shell: "ls ~{{ remote_regular_user }}/.fonts/JetBrainsMonoNerd*FontMono*"
      register: jetbrains_mono_exists
      ignore_errors: true
      changed_when: false

    - name: Download Jetbrains mono
      when: jetbrains_mono_exists is failed
      ansible.builtin.unarchive:
        src: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/JetBrainsMono.zip
        dest: "~{{ remote_regular_user }}/.fonts/"
        remote_src: true
        mode: "0755"
        owner: "{{ remote_regular_user }}"
